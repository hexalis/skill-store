name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack (dry run)
        run: |
          npm pack -w @apocryphon/core --dry-run
          npm pack -w @apocryphon/cli --dry-run

  package:
    name: Package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack tarballs
        run: |
          mkdir -p artifacts
          npm pack -w @apocryphon/core --pack-destination artifacts
          npm pack -w @apocryphon/cli --pack-destination artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: artifacts/*.tgz
          retention-days: 14
