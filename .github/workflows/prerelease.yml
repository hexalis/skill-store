name: Prerelease

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target GitHub Environment"
        required: true
        default: qa
        type: choice
        options:
          - develop
          - qa
      dist-tag:
        description: "npm dist-tag for the snapshot (dev, next, beta...)"
        required: true
        default: next

permissions:
  contents: read

concurrency:
  group: prerelease-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  prerelease:
    name: Changesets snapshot (${{ inputs.environment }})
    uses: hexalis/github-workflows/.github/workflows/changesets-prerelease.yml@main
    with:
      environment: ${{ inputs.environment }}
      dist-tag: ${{ inputs.dist-tag }}
      build-command: pnpm build
      npm-scope: hexalis
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
