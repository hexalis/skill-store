name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack (dry run)
        run: |
          npm pack -w @apocryphon/core --dry-run
          npm pack -w @apocryphon/cli --dry-run

  smoke:
    name: CLI smoke (non-interactive)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOME: ${{ runner.temp }}/home
      APOCRYPHON_HOME: ${{ runner.temp }}/home/.apocryphon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Exercise the CLI without a TTY
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          git init -q

          CLI="$GITHUB_WORKSPACE/packages/cli/dist/cli.mjs"

          node "$CLI" init --registry "$GITHUB_WORKSPACE/catalog" --clients claude --yes
          node "$CLI" install fixture-planning fixture-review
          node "$CLI" enable --global fixture-planning
          node "$CLI" enable fixture-review
          node "$CLI" pack apply fixtures
          node "$CLI" sync --dry-run
          node "$CLI" status --json > status.json
          node -e "const s = require('./status.json'); if (!s.skills.length) process.exit(1)"
          node "$CLI" list --json > list.json
          node -e "const rows = require('./list.json'); if (rows.length !== 2) process.exit(1)"
          node "$CLI" completion bash > /dev/null
          node "$CLI" __complete words en | grep -q enable
          node "$CLI" validate --registry --strict

  package:
    name: Package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack tarballs
        run: |
          mkdir -p artifacts
          npm pack -w @apocryphon/core --pack-destination artifacts
          npm pack -w @apocryphon/cli --pack-destination artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: artifacts/*.tgz
          retention-days: 14
