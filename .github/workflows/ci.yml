name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    uses: hexalis/github-workflows/.github/workflows/node-ci.yml@main
    with:
      package-manager: pnpm
      node-version: ${{ matrix.node }}
      typecheck-command: pnpm typecheck
      test-command: pnpm test
      build-command: pnpm build

  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    uses: hexalis/github-workflows/.github/workflows/changeset-check.yml@main

  smoke:
    name: CLI smoke (non-interactive)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Exercise the CLI without a TTY
        env:
          HOME: ${{ runner.temp }}/home
          SKILL_STORE_HOME: ${{ runner.temp }}/home/.skill-store
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          git init -q

          CLI="$GITHUB_WORKSPACE/packages/cli/dist/cli.mjs"

          node "$CLI" --version
          node "$CLI" init --registry "$GITHUB_WORKSPACE/catalog" --clients claude --yes
          node "$CLI" install fixture-planning fixture-review
          node "$CLI" enable --global fixture-planning
          node "$CLI" enable fixture-review
          node "$CLI" pack apply fixtures
          node "$CLI" sync --dry-run
          node "$CLI" status --json > status.json
          node -e "const s = require('./status.json'); if (!s.skills.length) process.exit(1)"
          node "$CLI" list --json > list.json
          node -e "const rows = require('./list.json'); if (rows.length !== 2) process.exit(1)"
          node "$CLI" completion bash > completion.sh
          grep -q 'skill-store hss' completion.sh
          node "$CLI" __complete words en | grep -q enable
          node "$CLI" validate --registry --strict
